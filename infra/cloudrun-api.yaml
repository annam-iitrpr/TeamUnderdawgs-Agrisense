# Cloud Run service definition for the platform API.
#
# Secrets are referenced from Secret Manager, never inlined here. Apply with:
#   gcloud run services replace infra/cloudrun-api.yaml --region "$GCP_REGION"
# Placeholders in ${...} are substituted by scripts/deploy/api.sh from the environment.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agrisense-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      # Naming the revision after the commit forces a new one, so a previously failed
      # revision with an identical spec is never silently reused.
      name: agrisense-api-${REVISION_SUFFIX}
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/cloudsql-instances: ${CLOUDSQL_INSTANCE_CONNECTION_NAME}
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ${API_SERVICE_ACCOUNT}
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: ${API_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: production
            - name: AGRISENSE_ENV_FILE
              value: /dev/null
            - name: AGRISENSE_DATA_MODE
              value: live
            - name: FIREBASE_PROJECT_ID
              value: "${FIREBASE_PROJECT_ID}"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${GCP_PROJECT_ID}"
            - name: GOOGLE_CLOUD_LOCATION
              value: "${GCP_REGION}"
            - name: PUBLIC_API_BASE_URL
              value: "${CLOUD_RUN_API_URL}"
            - name: PUBLIC_WEB_BASE_URL
              value: "${CLOUD_RUN_WEB_URL}"
            # Local origins are present so the farmer screens can be exercised against the
            # real API during development. Remove them before any real farmer data exists:
            # they let a page on a developer's own machine use a live session.
            - name: CORS_ALLOWED_ORIGINS
              value: "${CORS_ALLOWED_ORIGINS}"
            - name: GCS_MEDIA_BUCKET
              value: "${GCS_MEDIA_BUCKET}"
            # Signing goes through IAM signBlob; the metadata credential has no private key.
            - name: SIGNING_SERVICE_ACCOUNT
              value: "${API_SERVICE_ACCOUNT}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agrisense-database-url
                  key: latest
            - name: MEDIA_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: agrisense-media-signing-secret
                  key: latest
            # Inbound WhatsApp is a public URL; without the app secret every delivery is refused.
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: agrisense-meta-app-secret
                  key: latest
            - name: WHATSAPP_WEBHOOK_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agrisense-whatsapp-verify-token
                  key: latest
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agrisense-whatsapp-access-token
                  key: latest
            - name: WHATSAPP_PHONE_NUMBER_ID
              value: "${WHATSAPP_PHONE_NUMBER_ID}"
            # Queue only. Flipping this to live starts messaging real people, so it is a
            # deliberate deploy-time decision rather than a default.
            - name: WHATSAPP_SEND_MODE
              value: "${WHATSAPP_SEND_MODE}"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agrisense-gemini-api-key
                  key: latest
            - name: GEMINI_MODEL
              value: "${GEMINI_MODEL}"
            # Empty until a reviewed crop-vision model is deployed. Absent means no
            # labels, never a fallback guess.
            - name: VERTEX_VISION_ENDPOINT
              value: "${VERTEX_VISION_ENDPOINT}"
            - name: VISION_LOCATION
              value: "${VISION_LOCATION}"
            # Weather providers. Without these the forecast is genuinely unavailable and
            # every dependent capability says so, which is why they belong in the revision.
            - name: CEHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agrisense-cehub-api-key
                  key: latest
            - name: CEHUB_API_KEY_HEADER
              value: "${CEHUB_API_KEY_HEADER}"
            - name: METEOBLUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agrisense-meteoblue-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health/live
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
