<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AgriSense">
  <!-- Maskable: full-bleed background with no corner radius, and the mark kept
       inside the 80% centre safe zone so an aggressive circular or squircle
       mask cannot clip it. -->
