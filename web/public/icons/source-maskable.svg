  <g transform="translate(256 268) scale(8.4) translate(-16 -18)">
    <path d="M16 24c0-5 3-8.5 7-9.5-0.5 5-3.5 8.5-7 9.5z" fill="#3F9A5C" />
    <path d="M16 24c0-4.5-2.6-7.6-6.2-8.6C10.2 20 12.8 23.1 16 24z" fill="#9BBF4F" />
    <path d="M16 24V13" stroke="#F6F7F5" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
