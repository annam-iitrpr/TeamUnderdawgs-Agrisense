<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgriSense — offline</title>
    <!--
      Deliberately self-contained and static: this page is precached and must
      render with no network, no fonts and no scripts. It also shows no farm
      data, because nothing authenticated is cached.
    -->
    <style>
      :root {
        --forest: #0b5d3b;
        --ink: #14181b;
        --slate: #5a6165;
        --mist: #dfe3e5;
        --paper: #f6f7f5;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gurmukhi", "Noto Sans Telugu", Arial,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: var(--card);
        border: 1px solid var(--mist);
        border-radius: 14px;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: var(--slate); margin: 0 0 8px; }
      button {
        margin-top: 16px;
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: var(--forest);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
      .note {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--mist);
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg width="56" height="56" viewBox="0 0 32 32" role="img" aria-label="AgriSense">
        <rect width="32" height="32" rx="7" fill="#0B5D3B" />
        <path d="M16 24c0-5 3-8.5 7-9.5-0.5 5-3.5 8.5-7 9.5z" fill="#3F9A5C" />
        <path d="M16 24c0-4.5-2.6-7.6-6.2-8.6C10.2 20 12.8 23.1 16 24z" fill="#9BBF4F" />
        <path d="M16 24V13" stroke="#F6F7F5" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <h1>You are offline</h1>
      <p>AgriSense needs a connection to check your field's forecast.</p>
      <p class="note">
        Spray timing depends on the latest forecast, so no saved recommendation is shown here —
        an old window may already have passed.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
